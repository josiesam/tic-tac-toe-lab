<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="game-panel" aria-labelledby="game-title">
        <div class="title-row">
          <div>
            <p class="eyebrow">Coding challenge</p>
            <h1 id="game-title">Tic-Tac-Toe Lab</h1>
          </div>
          <button
            class="icon-button"
            id="themeButton"
            type="button"
            aria-label="Change color theme"
            title="Change color theme"
          >
            <span aria-hidden="true">◐</span>
          </button>
        </div>

        <div class="scoreboard" aria-label="Scoreboard">
          <div>
            <span class="score-label">X</span>
            <strong id="scoreX">0</strong>
          </div>
          <div>
            <span class="score-label">Rounds</span>
            <strong id="scoreRounds">0</strong>
          </div>
          <div>
            <span class="score-label">O</span>
            <strong id="scoreO">0</strong>
          </div>
        </div>

        <p class="status" id="status" aria-live="polite">
          Player X starts. Each player gets 3 pieces.
        </p>

        <div class="connect-panel" aria-label="Online game room">
          <div class="mode-row">
            <button id="localModeButton" type="button" class="mode-button active">
              Local
            </button>
            <button id="createRoomButton" type="button" class="mode-button">
              Create code
            </button>
          </div>
          <div class="join-row">
            <input
              id="roomCodeInput"
              type="text"
              maxlength="6"
              placeholder="Room code"
              aria-label="Room code"
            />
            <button id="joinRoomButton" type="button">Join</button>
          </div>
          <p class="room-info" id="roomInfo" aria-live="polite">
            Local game: two players use this board.
          </p>
        </div>

        <div class="board" id="board" aria-label="Tic-tac-toe board">
          <button
            class="cell"
            type="button"
            data-cell="0"
            aria-label="Top left square"
          ></button>
          <button
            class="cell"
            type="button"
            data-cell="1"
            aria-label="Top middle square"
          ></button>
          <button
            class="cell"
            type="button"
            data-cell="2"
            aria-label="Top right square"
          ></button>
          <button
            class="cell"
            type="button"
            data-cell="3"
            aria-label="Middle left square"
          ></button>
          <button
            class="cell"
            type="button"
            data-cell="4"
            aria-label="Center square"
          ></button>
          <button
            class="cell"
            type="button"
            data-cell="5"
            aria-label="Middle right square"
          ></button>
          <button
            class="cell"
            type="button"
            data-cell="6"
            aria-label="Bottom left square"
          ></button>
          <button
            class="cell"
            type="button"
            data-cell="7"
            aria-label="Bottom middle square"
          ></button>
          <button
            class="cell"
            type="button"
            data-cell="8"
            aria-label="Bottom right square"
          ></button>
        </div>

        <div class="controls">
          <button id="newRoundButton" type="button">New round</button>
          <button id="resetButton" type="button">Reset score</button>
        </div>
      </section>

      <!-- <aside class="thinking-panel" aria-labelledby="thinking-title">
        <h2 id="thinking-title">Think Like a Game Designer</h2>
        <ul>
          <li>What move blocks your opponent?</li>

          </p>
        </div>
      </aside> -->
    </main>

    <script src="script.js"></script>
  </body>
</html>
